<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Аналитика — ContextFlow</title>
<link rel="icon" href="/icon.png" />
<link rel="stylesheet" href="/style.css" />
<style>
  :root { --c1: #2563eb; --c2: #10b981; --c3: #8b5cf6; --warn: #d92d20; }
  @media (prefers-color-scheme: dark) { :root { --c1: #60a5fa; --c2: #34d399; --c3: #a78bfa; --warn: #ff6b5e; } }
  /* Safari on iPhone enlarges text in tables wider than the screen (the limits table went from 13 to 17 px). */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-size: 15px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 6px 0 18px; }
  .bar h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .bar .muted { color: var(--text-2); font-size: 13px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--bg-2); margin-left: auto; }
  .seg button { border: 0; background: none; font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 8px; color: var(--text-2); cursor: pointer; }
  .seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .link { border: 0; background: none; color: var(--blue); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: var(--bg-2); border-radius: 16px; padding: 16px 18px; border-top: 4px solid var(--c); }
  .card h2 { font-size: 15px; margin: 0; }
  .card .sub { color: var(--text-2); font-size: 12.5px; margin: 2px 0 10px; }
  .card .big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .card .big small { font-size: 13px; font-weight: 500; color: var(--text-2); margin-left: 6px; }
  .card dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 12px 0 0; font-size: 13.5px; }
  .card dt { color: var(--text-2); }
  .card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .card .bad { color: var(--warn); }
  .panel + .cards { margin-top: 14px; }
  .panel { position: relative; background: var(--bg-2); border-radius: 16px; padding: 16px 18px; margin-top: 14px; }
  .tip { position: absolute; z-index: 5; pointer-events: none; display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.14); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tip b { display: block; margin-bottom: 4px; }
  .tip .row { display: flex; justify-content: space-between; gap: 14px; }
  .tip .row span:last-child { font-weight: 600; }
  .tip .total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }
  td.hist { white-space: normal; min-width: 240px; line-height: 1.45; }
  td.hist div { white-space: nowrap; }
  td.hist time { color: var(--text-2); margin-right: 6px; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .panel h3 .seg { font-weight: 400; }
  .panel h4 { margin: 16px 0 6px; font-size: 13.5px; }
  .hint { font-size: 12.5px; color: var(--text-2); margin: 8px 0 0; line-height: 1.45; }
  .muted { color: var(--text-2); }
  td small { display: block; color: var(--text-2); font-size: 11.5px; }
  table.text th, table.text td { text-align: left; }
  tr.sum td { font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  svg text { fill: var(--text-2); font-size: 10.5px; }
  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  table.num2 th:nth-child(2), table.num2 td:nth-child(2) { text-align: right; }
  th { color: var(--text-2); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 6px; }
  .empty { color: var(--text-2); font-size: 13px; }
  .login { max-width: 420px; margin: 60px auto; background: var(--bg-2); border-radius: 18px; padding: 22px; }
  .login h1 { font-size: 22px; margin: 0 0 6px; }
  .login p { color: var(--text-2); font-size: 14px; margin: 0 0 14px; }
  .login input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .login button { margin-top: 10px; width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; cursor: pointer; }
  .err { color: var(--warn); font-size: 13.5px; margin-top: 10px; min-height: 1em; }
  .note { font-size: 12.5px; color: var(--text-2); margin: 14px 0 30px; }
  .card.wide { grid-column: span 2; min-width: 0; }
  @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } .card.wide { grid-column: auto; } .seg { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict"
// Owner analytics: GET /api/v2/admin/usage with the ADMIN_TOKEN (kept in this browser only).
const TOKEN_KEY = "cf-admin-token"
const SEGMENTS = [
  { key: "ours", segment: "ai", title: "Наш ключ · ИИ", sub: "OpenAI через наш сервер", color: "var(--c1)" },
  { key: "ours", segment: "google", title: "Наш ключ · Google", sub: "Gemini + поиск Google через наш сервер", color: "var(--c2)" },
  { key: "own", segment: "ai", title: "Ключ пользователя", sub: "OpenAI / Claude напрямую с устройства", color: "var(--c3)" }
]
const DEVICES = { iPhone: "iPhone", iPad: "iPad", Mac: "Mac", Chrome: "Chrome", unknown: "Версии 1.x (тип устройства не передают)" }
const PRODUCTS = { "com.contextflow.pro.monthly": "Pro · месяц", "com.contextflow.pro.yearly": "Pro · год", "com.contextflow.byok.monthly": "Свой ключ · месяц" }
const PLANS = {
  free: "Бесплатный", pro: "Pro", byok: "Подписка «Свой ключ», через наш сервер", own_key: "Ключ пользователя, с устройства",
  legacy_anonymous: "1.x без аккаунта", legacy_user: "1.x с аккаунтом", unknown: "Не указан"
}
const SUB_STATUS = {
  active: "активна", renewal_off: "автопродление выключено", billing_retry: "не прошла оплата",
  downgrade: "сменит тариф при продлении", expired: "закончилась", refunded: "возврат"
}
// App Store notifications (type or type:subtype) in a subscription's history; "+" adds the plan's name.
const SUB_EVENT = {
  "SUBSCRIBED:INITIAL_BUY": "оформил +", "SUBSCRIBED:RESUBSCRIBE": "снова оформил +",
  "DID_RENEW": "продлилась", "DID_RENEW:BILLING_RECOVERY": "продлилась после сбоя оплаты",
  "DID_CHANGE_RENEWAL_PREF:UPGRADE": "перешёл на +", "DID_CHANGE_RENEWAL_PREF:DOWNGRADE": "при продлении перейдёт на +",
  "DID_CHANGE_RENEWAL_PREF": "при продлении останется на +",
  "DID_CHANGE_RENEWAL_STATUS:AUTO_RENEW_DISABLED": "выключил автопродление",
  "DID_CHANGE_RENEWAL_STATUS:AUTO_RENEW_ENABLED": "включил автопродление",
  "DID_FAIL_TO_RENEW": "не прошла оплата", "DID_FAIL_TO_RENEW:GRACE_PERIOD": "не прошла оплата, льготный период",
  "EXPIRED": "закончилась", "GRACE_PERIOD_EXPIRED": "закончилась после сбоя оплаты",
  "REFUND": "возврат денег", "REVOKE": "доступ отозван"
}
// How a subscription was taken (subscription_terms). Free ones are shown apart and stay out of the counts,
// conversion and MRR until someone pays.
const TERMS = {
  full: "полная цена", discount: "со скидкой по коду", trial: "пробный период", free_code: "бесплатно по коду",
  press: "подарок, пресса", owner: "владелец (подарочный код)"
}
const unpaid = (s) => Boolean(s.terms) && !s.paid_from
// USD per currency for MRR: a free daily dataset (units per 1 USD); the page works without it.
const RATES = [
  "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json",
  "https://latest.currency-api.pages.dev/v1/currencies/usd.min.json"
]
const APPLE_CUT = 0.15
const PLATFORMS = { ios: "iPhone", ipados: "iPad", macos: "Mac", chrome: "Chrome" }
// App Store storefronts come as ISO alpha-3; Intl names countries by alpha-2.
const STOREFRONTS = Object.fromEntries((
  "AFG AF ALB AL DZA DZ AGO AO AIA AI ATG AG ARG AR ARM AM AUS AU AUT AT AZE AZ BHS BS BHR BH BRB BB BLR BY BEL BE BLZ BZ " +
  "BEN BJ BMU BM BTN BT BOL BO BIH BA BWA BW BRA BR VGB VG BRN BN BGR BG BFA BF KHM KH CMR CM CAN CA CPV CV CYM KY TCD TD " +
  "CHL CL CHN CN COL CO COD CD COG CG CRI CR CIV CI HRV HR CYP CY CZE CZ DNK DK DMA DM DOM DO ECU EC EGY EG SLV SV EST EE " +
  "SWZ SZ FJI FJ FIN FI FRA FR GAB GA GMB GM GEO GE DEU DE GHA GH GRC GR GRD GD GTM GT GNB GW GUY GY HND HN HKG HK HUN HU " +
  "ISL IS IND IN IDN ID IRQ IQ IRL IE ISR IL ITA IT JAM JM JPN JP JOR JO KAZ KZ KEN KE KOR KR XKS XK KWT KW KGZ KG LAO LA " +
  "LVA LV LBN LB LBR LR LBY LY LTU LT LUX LU MAC MO MDG MG MWI MW MYS MY MDV MV MLI ML MLT MT MRT MR MUS MU MEX MX FSM FM " +
  "MDA MD MNG MN MNE ME MSR MS MAR MA MOZ MZ MMR MM NAM NA NRU NR NPL NP NLD NL NZL NZ NIC NI NER NE NGA NG MKD MK NOR NO " +
  "OMN OM PAK PK PLW PW PAN PA PNG PG PRY PY PER PE PHL PH POL PL PRT PT QAT QA ROU RO RUS RU RWA RW KNA KN LCA LC VCT VC " +
  "STP ST SAU SA SEN SN SRB RS SYC SC SLE SL SGP SG SVK SK SVN SI SLB SB ZAF ZA ESP ES LKA LK SUR SR SWE SE CHE CH TWN TW " +
  "TJK TJ TZA TZ THA TH TON TO TTO TT TUN TN TUR TR TKM TM TCA TC UGA UG UKR UA ARE AE GBR GB USA US URY UY UZB UZ VUT VU " +
  "VEN VE VNM VN YEM YE ZMB ZM ZWE ZW"
).split(" ").reduce((pairs, code, i, all) => i % 2 ? pairs : [...pairs, [code, all[i + 1]]], []))
const n = new Intl.NumberFormat("ru-RU")
const compact = new Intl.NumberFormat("ru-RU", { notation: "compact", maximumFractionDigits: 1 })
const languages = new Intl.DisplayNames(["ru"], { type: "language" })
const regions = new Intl.DisplayNames(["ru"], { type: "region" })
const app = document.getElementById("app")
let days = 30
// Requests chart: by segment or by new vs returning users; conversion: by week or by day.
let requestsBy = "segment"
let cohortsBy = "week"

function store(value) {
  try { value ? localStorage.setItem(TOKEN_KEY, value) : localStorage.removeItem(TOKEN_KEY) } catch {}
}
function token() {
  try { return localStorage.getItem(TOKEN_KEY) || "" } catch { return "" }
}

// Builds elements with textContent only: model names come from client reports.
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k === "style") node.setAttribute("style", v)
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v)
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? "" : v)
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : String(c))
  return node
}
function svg(tag, attrs = {}, ...children) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag)
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v)
  for (const c of children.flat()) if (c) node.append(c instanceof Node ? c : document.createTextNode(String(c)))
  return node
}

function login(message = "") {
  const input = el("input", { type: "password", placeholder: "ADMIN_TOKEN", autocomplete: "current-password" })
  const submit = (e) => { e.preventDefault(); if (input.value.trim()) { store(input.value.trim()); load() } }
  app.replaceChildren(el("form", { class: "login", onsubmit: submit },
    el("h1", {}, "Аналитика ContextFlow"),
    el("p", {}, "Введите ADMIN_TOKEN из переменных окружения Netlify. Он сохранится только в этом браузере."),
    input,
    el("button", { type: "submit" }, "Открыть"),
    el("div", { class: "err" }, message)
  ))
  input.focus()
}

async function load() {
  const t = token()
  if (!t) return login()
  app.replaceChildren(el("p", { class: "empty", style: "padding:40px 0" }, "Загружаю…"))
  rates ||= usdRates()
  let res
  try {
    res = await fetch(`/api/v2/admin/usage?days=${days}`, { headers: { Authorization: `Bearer ${t}` } })
  } catch {
    return login("Нет соединения с сервером.")
  }
  if (res.status === 401) { store(""); return login("Неверный токен.") }
  if (res.status === 404) return login("Аналитика выключена: задайте ADMIN_TOKEN в Netlify и передеплойте сайт.")
  if (!res.ok) return login(`Сервер ответил ${res.status}. Попробуйте позже.`)
  render(await res.json(), await rates)
}

// Today's USD rates for MRR, fetched once per page; null when no source answers.
let rates = null
async function usdRates() {
  for (const url of RATES) {
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(4000) })
      const body = res.ok ? await res.json() : null
      if (body?.usd) return { date: body.date, rates: body.usd }
    } catch {
      // try the next source
    }
  }
  return null
}

const sum = (rows, field) => rows.reduce((s, r) => s + Number(r[field] || 0), 0)
const ms = (v) => v == null ? "—" : v >= 1000 ? `${(v / 1000).toFixed(1)} с` : `${n.format(v)} мс`
const segOf = (r) => SEGMENTS.find((s) => s.key === r.key && s.segment === r.segment)

// rows: [label, value, class?]; falsy rows are skipped.
function statCard({ title, sub, color, big, unit, rows }) {
  return el("div", { class: "card", style: `--c:${color}` },
    el("h2", {}, title),
    el("div", { class: "sub" }, sub),
    el("div", { class: "big" }, big, el("small", {}, unit)),
    el("dl", {}, rows.filter(Boolean).flatMap(([dt, dd, cls]) => [el("dt", {}, dt), el("dd", { class: cls || "" }, dd)]))
  )
}

function card(seg, row) {
  const r = row || { requests: 0, failed: 0, installs: 0, prompt_tokens: 0, completion_tokens: 0, search_queries: 0, avg_ms: null }
  return statCard({
    title: seg.title, sub: seg.sub, color: seg.color, big: n.format(r.requests), unit: "запросов",
    rows: [
      ["Устройств", n.format(r.installs)],
      ["Токены: вход / выход", `${compact.format(r.prompt_tokens)} / ${compact.format(r.completion_tokens)}`],
      seg.segment === "google" && ["Поисковых запросов Google", n.format(r.search_queries)],
      ["Среднее время ответа", ms(r.avg_ms)],
      ["С ошибкой", n.format(r.failed), r.failed ? "bad" : ""]
    ]
  })
}

// The last `count` UTC days, oldest first, as "YYYY-MM-DD".
function lastDays(count) {
  const end = new Date()
  const keys = []
  for (let i = count - 1; i >= 0; i--) keys.push(new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth(), end.getUTCDate() - i)).toISOString().slice(0, 10))
  return keys
}

function userCards(users, subs, totalDays) {
  const byDay = users.by_day || []
  // Average over the days since the first one with data, so a fresh launch isn't diluted by empty days.
  const keys = lastDays(totalDays)
  const start = byDay.length ? keys.indexOf(byDay[0].day) : -1
  const span = start >= 0 ? keys.length - start : keys.length
  const avg = (field) => (sum(byDay, field) / Math.max(1, span)).toLocaleString("ru-RU", { maximumFractionDigits: 1 })
  const products = subs.by_product || []
  const lost = sum(products, "expired") + sum(products, "refunded")
  const free = Object.entries(subs.free || {}).filter(([, count]) => count > 0)
  return el("div", { class: "cards" },
    statCard({
      title: "Активные пользователи", sub: "Открыли панель или задали вопрос, по дням UTC", color: "var(--c1)",
      big: n.format(users.active_today || 0), unit: "сегодня (DAU)",
      rows: [
        ["В среднем в день", avg("active")],
        [`Уникальных за ${totalDays} дн.`, n.format(users.active || 0)],
        ["Из них задавали вопросы", n.format(users.asked || 0)]
      ]
    }),
    statCard({
      title: "Новые пользователи", sub: "Первый раз открыли ContextFlow", color: "var(--c2)",
      big: n.format(users.new || 0), unit: `за ${totalDays} дн.`,
      rows: [
        ["Сегодня", n.format(users.new_today || 0)],
        ["В среднем в день", avg("new")]
      ]
    }),
    statCard({
      title: "Подписки", sub: "App Store, без песочницы App Review", color: "var(--c3)",
      big: n.format(sum(products, "active")), unit: "активных",
      rows: [
        ...products.map((p) => [PRODUCTS[p.product_id] || p.product_id, n.format(p.active)]),
        [`Новых за ${totalDays} дн.`, n.format(sum(products, "new"))],
        sum(products, "switched") > 0 && ["Сменили тариф", n.format(sum(products, "switched"))],
        ["Автопродление выключено", n.format(sum(products, "renewal_off"))],
        sum(products, "billing_retry") > 0 && ["Не прошла оплата", n.format(sum(products, "billing_retry")), "bad"],
        ["Закончились или возврат", n.format(lost), lost ? "bad" : ""],
        ...free.map(([terms, count]) => [`Бесплатно, не входит: ${TERMS[terms] || terms}`, n.format(count)])
      ]
    })
  )
}

const dayLabel = (d) => new Date(`${d}T12:00:00Z`).toLocaleDateString("ru-RU", { weekday: "short", day: "numeric", month: "long", timeZone: "UTC" })

// Stacked bars per UTC day; hovering (or tapping) a day shows its numbers. series: [{ title, color, value(day) }].
// title may hold controls next to the text.
function chart(title, series, totalDays) {
  const keys = lastDays(totalDays)
  const totals = keys.map((d) => series.reduce((s, x) => s + x.value(d), 0))
  const max = Math.max(1, ...totals)
  const W = 900, H = 210, L = 34, B = 22, T = 8
  const bw = (W - L) / keys.length
  const nodes = []
  for (const f of [0, 0.5, 1]) {
    const y = T + (H - T - B) * (1 - f)
    nodes.push(svg("line", { x1: L, x2: W, y1: y, y2: y, stroke: "currentColor", "stroke-opacity": "0.12" }))
    nodes.push(svg("text", { x: L - 6, y: y + 3, "text-anchor": "end" }, n.format(Math.round(max * f))))
  }
  keys.forEach((d, i) => {
    let y = H - B
    const x = L + i * bw + bw * 0.15
    for (const s of series) {
      const v = s.value(d)
      if (!v) continue
      const h = (H - T - B) * (v / max)
      y -= h
      nodes.push(svg("rect", { x, y, width: Math.max(1, bw * 0.7), height: h, rx: 2, fill: s.color }))
    }
    const every = Math.ceil(keys.length / 10)
    if (i % every === 0 || i === keys.length - 1) nodes.push(svg("text", { x: L + i * bw + bw / 2, y: H - 6, "text-anchor": "middle" }, d.slice(5).replace("-", ".")))
  })
  const tip = el("div", { class: "tip" })
  const panel = el("div", { class: "panel" })
  const highlight = svg("rect", { x: 0, y: T, width: bw, height: H - T - B, rx: 3, fill: "currentColor", "fill-opacity": "0.07", visibility: "hidden" })
  const show = (i, e) => {
    highlight.setAttribute("x", L + i * bw)
    highlight.setAttribute("visibility", "visible")
    tip.replaceChildren(...[
      el("b", {}, dayLabel(keys[i])),
      ...series.map((s) => el("div", { class: "row" }, el("span", {}, el("span", { class: "dot", style: `background:${s.color}` }), s.title), el("span", {}, n.format(s.value(keys[i]))))),
      series.length > 1 && el("div", { class: "row total" }, el("span", {}, "Всего"), el("span", {}, n.format(totals[i])))
    ].filter(Boolean))
    tip.style.display = "block"
    const box = panel.getBoundingClientRect()
    const left = e.clientX - box.left + 14
    tip.style.left = `${Math.max(8, Math.min(left, box.width - tip.offsetWidth - 8))}px`
    tip.style.top = `${Math.max(8, e.clientY - box.top - tip.offsetHeight - 12)}px`
  }
  const hide = () => {
    tip.style.display = "none"
    highlight.setAttribute("visibility", "hidden")
  }
  // A transparent column per day catches the pointer over its whole height, not just the bar.
  const hits = keys.map((_, i) => {
    const hit = svg("rect", { x: L + i * bw, y: T, width: bw, height: H - T - B, fill: "transparent" })
    hit.addEventListener("pointermove", (e) => show(i, e))
    hit.addEventListener("pointerdown", (e) => show(i, e))
    return hit
  })
  const chartSvg = svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "min-width:640px", role: "img", "aria-label": [title].flat()[0] }, highlight, nodes, hits)
  chartSvg.addEventListener("pointerleave", hide)
  panel.append(
    el("h3", {}, title),
    el("div", { class: "legend" }, series.map((s) => el("span", {}, el("i", { style: `background:${s.color}` }), s.title))),
    // Wide enough to stay readable on a phone (scrolls sideways there).
    el("div", { class: "tbl" }, chartSvg),
    tip
  )
  return panel
}

// The subscription's App Store history, oldest first. Apple also reports the old plan's renewal
// switching off when someone upgrades or downgrades; that's part of the switch, not a cancellation.
function history(events) {
  const shown = events.filter((e, i) => !(
    e.type === "DID_CHANGE_RENEWAL_STATUS" &&
    events.slice(i + 1).some((x) => x.type === "DID_CHANGE_RENEWAL_PREF" && x.product !== e.product && Date.parse(x.at) - Date.parse(e.at) < 120_000)
  ))
  return shown.map((e) => {
    const label = SUB_EVENT[e.subtype ? `${e.type}:${e.subtype}` : e.type] || SUB_EVENT[e.type] || [e.type, e.subtype].filter(Boolean).join(" · ")
    const text = label.endsWith("+") ? `${label.slice(0, -1)}${PRODUCTS[e.product] || e.product}` : label
    return el("div", {}, el("time", {}, new Date(e.at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })), text)
  })
}

// cls "num2": the second column holds numbers too (right-aligned).
function table(title, head, rows, empty, cls) {
  return el("div", { class: "panel" },

    rows.length
      ? el("div", { class: "tbl" }, el("table", { class: cls }, el("thead", {}, el("tr", {}, head.map((h) => el("th", {}, h)))), el("tbody", {}, rows)))
      : el("p", { class: "empty" }, empty)
  )
}

function label(r) {
  const seg = segOf(r)
  return el("span", {}, el("span", { class: "dot", style: `background:${seg ? seg.color : "var(--text-2)"}` }), seg ? seg.title : `${r.key} · ${r.segment}`)

// A section that redraws itself: make(redraw) builds it, its controls call redraw.
function live(make) {
  const holder = el("div")
  const draw = () => holder.replaceChildren(make(draw))
  draw()
  return holder
}
function toggle(options, current, pick) {
  return el("div", { class: "seg" }, options.map(([value, text]) => el("button", { class: value === current ? "on" : "", onclick: () => pick(value) }, text)))
}

const NO_INSIGHTS = "Нет данных: в базе ещё нет функции cf_owner_insights (миграция 20261102120000)."
const nameOf = (names, code) => { try { return names.of(code) || code } catch { return code } }
const unique = (list) => [...new Set(list.filter(Boolean))]
const pct = (part, whole) => whole ? `${(100 * part / whole).toLocaleString("ru-RU", { maximumFractionDigits: 1 })} %` : "—"
// The extension's UI language, e.g. "ko-US": the language and the device's region setting.
function localeParts(locale) {
  const parts = String(locale || "").replace(/_/g, "-").split("-").filter(Boolean)
  if (!parts.length) return [null, null]
  const region = parts.slice(1).find((p) => /^([A-Za-z]{2}|\d{3})$/.test(p))
  return [nameOf(languages, parts[0].toLowerCase()), region ? region.toUpperCase() : null]
}
function since(from, to) {
  const min = Math.max(0, Math.round((Date.parse(to) - Date.parse(from)) / 60_000))
  return min < 60 ? `${min} мин` : min < 48 * 60 ? `${Math.round(min / 60)} ч` : `${Math.round(min / 1440)} дн.`
}

// Monday of the UTC week, "YYYY-MM-DD".
function weekOf(day) {
  const d = new Date(`${day}T00:00:00Z`)
  d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7)
  return d.toISOString().slice(0, 10)
}
const short = (day) => new Date(`${day}T12:00:00Z`).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", timeZone: "UTC" })

// New users by the day or week they first opened ContextFlow, and how many of them subscribed.
function cohortPanel(insights, redraw) {
  const pick = (v) => { cohortsBy = v; redraw() }
  const title = ["Конверсия новых пользователей в подписку", insights && toggle([["week", "По неделям"], ["day", "По дням"]], cohortsBy, pick)]
  if (!insights) return table(title, [], [], NO_INSIGHTS)
  const groups = new Map()
  const fields = ["users", "subscribed", "ready_7", "in_7", "ready_30", "in_30"]
  for (const r of insights.cohorts || []) {
    const key = cohortsBy === "week" ? weekOf(r.day) : r.day
    const g = groups.get(key) || Object.fromEntries(fields.map((f) => [f, 0]))
    for (const f of fields) g[f] += Number(r[f] || 0)
    groups.set(key, g)
  }
  const share = (part, whole) => whole ? `${n.format(part)} · ${pct(part, whole)}` : el("span", { class: "muted", title: "Ещё не прошло столько дней с первого открытия" }, "рано")
  const row = (label, g, cls) => el("tr", { class: cls || "" },
    el("td", {}, label),
    el("td", {}, n.format(g.users)),
    el("td", {}, `${n.format(g.subscribed)} · ${pct(g.subscribed, g.users)}`),
    el("td", {}, share(g.in_7, g.ready_7)),
    el("td", {}, share(g.in_30, g.ready_30))
  )
  const keys = [...groups.keys()].sort().reverse()
  const label = (key) => cohortsBy === "week"
    ? `${short(key)}–${short(new Date(Date.parse(`${key}T12:00:00Z`) + 6 * 86_400_000).toISOString().slice(0, 10))}`
    : new Date(`${key}T12:00:00Z`).toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "UTC" })
  const total = Object.fromEntries(fields.map((f) => [f, [...groups.values()].reduce((s, g) => s + g[f], 0)]))
  const rows = [...keys.map((k) => row(label(k), groups.get(k))), keys.length > 1 && row(`Всего за ${insights.days} дн.`, total, "sum")].filter(Boolean)
  const unlinked = (insights.subscribers || []).filter((s) => !s.link && !unpaid(s)).length
  const panel = table(title, [cohortsBy === "week" ? "Неделя первого открытия" : "День первого открытия", "Новых", "Подписались (пока)", "В первые 7 дней", "В первые 30 дней"], rows, "Новых пользователей за период нет.", "num2")
  panel.append(el("p", { class: "hint" },
    "Новый пользователь — установка расширения в первый день, когда открыла панель (UTC). «В первые 7 / 30 дней» считается только по тем, у кого эти дни уже прошли. ",
    unlinked ? `Ещё ${n.format(unlinked)} подписк${unlinked === 1 ? "а" : "и"} без установки (купили в приложении, панель не открывали или открыли до покупки в другой день) — в конверсию не входят.` : ""

function money(amount, currency) {
  try {
    return new Intl.NumberFormat("ru-RU", { style: "currency", currency, maximumFractionDigits: 2 }).format(amount)
  } catch {
    return `${n.format(amount)} ${currency}`
  }
}
// An amount in a currency in USD at the day's rate; null without one.
const toUsd = (amount, currency, fx) => {
  if (currency === "USD") return amount
  const rate = fx?.rates?.[String(currency).toLowerCase()]
  return rate ? amount / rate : null
}

// What a subscription costs now (its latest transaction), with USD next to other currencies.
function priceCell(r, fx) {
  if (r.price == null) return el("td", {}, "—")
  const amount = Number(r.price) / 1000
  const usd = amount > 0 && r.currency !== "USD" && toUsd(amount, r.currency, fx)
  return el("td", { title: r.estimated ? "Apple присылает цену с 29.10, эту подписку купили раньше: оценка по цене в США, точная цена придёт с продлением" : null },
    `${r.estimated ? "≈ " : ""}${money(amount, r.currency)}`,
    usd != null && usd !== false && el("small", {}, `≈ ${money(usd, "USD")}`),
    r.estimated && el("small", {}, "оценка: цена в США"))
}

// MRR: what active paying subscribers pay a month now, and at the end of each week (cf_owner_insights.mrr), in USD.
function mrrCards(insights, fx) {
  if (!insights?.mrr) return el("div", { class: "panel" }, el("h3", {}, "MRR"), el("p", { class: "empty" }, "Нет данных: в базе ещё нет MRR (миграция 20261102150000)."))
  const rows = insights.mrr
  const week = (w) => {
    const rs = rows.filter((r) => r.week === w)
    const usd = (field) => rs.reduce((s, r) => s + (toUsd(Number(r[field]) / 1000, r.currency, fx) ?? 0), 0)
    return {
      usd: usd("amount"), off: usd("renewal_off_amount"),
      paying: sum(rs, "paying"), free: sum(rs, "free"), estimated: sum(rs, "estimated"), renewalOff: sum(rs, "renewal_off"),
      noRate: unique(rs.filter((r) => Number(r.amount) > 0 && toUsd(1, r.currency, fx) == null).map((r) => r.currency))
    }
  }
  const thisWeek = weekOf(new Date().toISOString().slice(0, 10))
  const now = week(thisWeek)
  const weeks = unique(rows.map((r) => r.week)).sort().reverse()
  const usd = (v) => money(v, "USD")
  return el("div", { class: "cards" },
    statCard({
      title: "MRR", sub: "Платящие подписчики в месяц, сейчас · USD", color: "var(--c2)",
      big: usd(now.usd), unit: "в месяц",
      rows: [
        [`После комиссии Apple ${APPLE_CUT * 100} %`, usd(now.usd * (1 - APPLE_CUT))],
        ["Платящих", n.format(now.paying)],
        ["Бесплатных по кодам и пробных", n.format(now.free)],
        now.renewalOff > 0 && ["Выключили автопродление", `${n.format(now.renewalOff)} · ${usd(now.off)}`, "bad"],
        now.estimated > 0 && ["Цена не записана, по цене в США", n.format(now.estimated)],
        now.noRate.length > 0 && ["Не пересчитано, нет курса", now.noRate.join(", "), "bad"]
      ]
    }),
    el("div", { class: "card wide", style: "--c:var(--c2)" },
      el("h2", {}, "MRR по неделям"),
      el("div", { class: "sub" }, `На конец недели (UTC), текущая — на сейчас${fx ? ` · курс на ${new Date(`${fx.date}T12:00:00Z`).toLocaleDateString("ru-RU")}` : " · курсы валют не загрузились, учтены только доллары"}`),
      weeks.length
        ? el("div", { class: "tbl" }, el("table", { class: "num2" },
            el("thead", {}, el("tr", {}, ["Неделя", "MRR", "После Apple", "Платящих", "Бесплатных"].map((h) => el("th", {}, h)))),
            el("tbody", {}, weeks.map((w) => {
              const x = week(w)
              return el("tr", {},
                el("td", {}, w === thisWeek ? `${short(w)} — сейчас` : `${short(w)}–${short(new Date(Date.parse(`${w}T12:00:00Z`) + 6 * 86_400_000).toISOString().slice(0, 10))}`),
                el("td", {}, usd(x.usd)), el("td", {}, usd(x.usd * (1 - APPLE_CUT))), el("td", {}, n.format(x.paying)), el("td", {}, n.format(x.free)))
            }))))
        : el("p", { class: "empty" }, "Платящих подписок пока не было."),
      el("p", { class: "hint" }, "Цена каждой подписки — из её последней транзакции: месяц со скидкой — по фактической цене, бесплатные — 0, годовая — 1/12. Цена в App Store включает налоги (в ЕС — НДС), поэтому выплата Apple меньше, чем «после комиссии».")
    )

  const userDay = (field) => (day) => Number((users.by_day || []).find((r) => r.day === day)?.[field] || 0)
  const subs = data.subscriptions || {}
  const date = (v) => v ? new Date(v).toLocaleDateString("ru-RU") : "—"
  // Who subscribed: matched to the report's list by the moment the subscription was first recorded.
  const who = new Map((insights?.subscribers || []).map((s) => [s.created_at, s]))
  const subRow = (r) => {
    const s = who.get(r.created_at)
    const firstSeen = (s?.installs || []).map((i) => i.first_seen).filter(Boolean).sort()[0]
    const terms = r.terms && [
      TERMS[r.terms] || r.terms,
      ["discount", "free_code"].includes(r.terms) && r.offer_id && `«${r.offer_id}»`,
      ["trial", "free_code", "press"].includes(r.terms) && r.paid_from && `платит с ${date(r.paid_from)}`
    ].filter(Boolean).join(" · ")
    return el("tr", {},
      el("td", {}, PRODUCTS[r.product_id] || r.product_id, terms && el("small", {}, terms)),
      ...subscriberCells(s),
      el("td", { class: "hist" }, (r.history || []).length ? history(r.history) : "—"),
      el("td", { class: ["expired", "refunded", "billing_retry"].includes(r.status) ? "bad" : "" }, SUB_STATUS[r.status] || r.status),
      priceCell(r, fx),
      el("td", {}, new Date(r.created_at).toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" }),
        firstSeen && el("small", {}, Date.parse(firstSeen) <= Date.parse(r.created_at) ? `через ${since(firstSeen, r.created_at)} после первого открытия` : "до первого открытия панели")),
      el("td", {}, date(r.expires_at), unpaid(r) && el("small", {}, "бесплатно"))
    )
  }
  const list = subs.list || []
  const freeRows = list.filter(unpaid).map(subRow)
  const subRows = [
    ...list.filter((r) => !unpaid(r)).map(subRow),
    freeRows.length > 0 && el("tr", { class: "sum" }, el("td", { colspan: 10 }, "Бесплатные (подарки, пробные, бесплатные коды): не входят в платящих, конверсию и MRR")),
    ...freeRows
  ].filter(Boolean)
  // From opening the app to paying: each app or install on the day it first got there.
  const funnelRows = (data.setup_funnel || []).filter((r) =>
    ["app_opened", "extension_on", "panel_opened", "first_answer", "offer_redeemed", "subscribed"].some((k) => r[k] > 0)
  ).map((r) => el("tr", {},
    el("td", {}, new Date(r.day).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" })),
    el("td", {}, r.app_opened ? `${n.format(r.app_opened)} (${n.format(r.notifications_allowed)})` : "—"),
    el("td", {}, n.format(r.extension_on)),
    el("td", {}, n.format(r.panel_opened)),
    el("td", {}, n.format(r.first_answer)),
    el("td", {}, n.format(r.offer_redeemed ?? 0)),
    el("td", {}, n.format(r.subscribed))
  ))
  const plans = (data.by_plan || []).map((r) => el("tr", {},
    el("td", {}, PLANS[r.plan] || r.plan),
    el("td", {}, n.format(r.requests)),
    el("td", {}, n.format(r.installs)),
    el("td", {}, n.format(r.max_per_day))
  ))

  app.replaceChildren(
    el("div", { class: "bar" },
      el("h1", {}, "Аналитика"),
      el("span", { class: "muted" }, `${n.format(total)} запросов реальных пользователей за ${data.days} дн. · обновлено ${new Date(data.generated_at).toLocaleString("ru-RU")}`),
      el("div", { class: "seg" }, periodButtons),
      el("button", { class: "link", onclick: () => load() }, "Обновить"),
      el("button", { class: "link", onclick: () => { store(""); login() } }, "Выйти")
    ),
    mrrCards(insights, fx),
    userCards(users, subs, data.days),
    chart("Активные пользователи по дням", [
      { title: "Новые", color: "var(--c2)", value: userDay("new") },
      { title: "Вернувшиеся", color: "var(--c1)", value: (d) => userDay("active")(d) - userDay("new")(d) }
    ], data.days),
    table("Путь нового пользователя (загрузки — в App Store Connect)",
      ["День (UTC)", "Открыли приложение (разрешили уведомления)", "Включили расширение", "Открыли панель", "Первый ответ", "Подписались по коду −50%", "Первая оплата"],
      funnelRows, "Пока пусто: приложение и расширение сообщают об этих шагах с версии 2.4.", "num2"),
    live((redraw) => cohortPanel(insights, redraw)),
    table(`Подписки${subs.sandbox ? ` · ещё ${n.format(subs.sandbox)} в песочнице (App Review, тесты)` : ""}`,
      ["Тариф", "Устройство", "Язык", "Страна", "Источник", "История (ваше время)", "Статус", "Цена сейчас", "Оформлена", "Оплачена до"], subRows, "Подписок пока нет.", "text"),
    sourcesPanel(insights),
    el("div", { class: "cards" }, SEGMENTS.map((s) => card(s, segments.find((r) => r.key === s.key && r.segment === s.segment)))),
    live((redraw) => {
      const age = insights?.requests_by_age
      const pick = (v) => { requestsBy = v; redraw() }
      const byAge = requestsBy === "age" && age
      const ageOf = (field) => (day) => Number(age.find((r) => r.day === day)?.[field] || 0)
      return chart(["Запросы по дням", age && toggle([["segment", "По сегментам"], ["age", "Новые и старые пользователи"]], requestsBy, pick)], byAge
        ? [
            { title: "Новые: в первый день", color: "var(--c2)", value: ageOf("new") },
            { title: "Старые: установили раньше", color: "var(--c1)", value: ageOf("old") }
          ]
        : SEGMENTS.map((seg) => ({
            title: seg.title, color: seg.color,
            value: (day) => Number((data.by_day || []).find((r) => r.day === day && r.key === seg.key && r.segment === seg.segment)?.requests || 0)
          })), data.days)
    }),
    perUserPanel(insights),
    table("По тарифам", ["Тариф", "Запросы", "Устройств", "Больше всего за день на устройство"], plans, "Пока нет запросов.", "num2"),
    table("По устройствам", ["Устройство", "Сегмент", "Запросы", "Устройств", "Токены вход", "Токены выход", "Поиск Google"], devices, "Пока нет запросов."),
    table("По моделям", ["Сегмент", "Модель", "Запросы", "Ошибки", "Токены вход", "Токены выход", "Поиск Google", "Ср. время"], models, "Пока нет запросов."),
    table(`Ревью: вы или App Review (${n.format(sum(review, "requests"))})`, ["Устройство", "Сегмент", "Версия", "Запросы", "Устройств", "Дни"], reviewRows, "Пока версия на ревью, запросы с неё попадают сюда, а не в цифры выше."),
    table("Упёрлись в лимит", ["Тип", "Лимит · план", "Раз"], limits, "Никто не упирался в лимиты."),
    table("Ошибки провайдеров", ["Тип", "Провайдер", "Ошибок"], errors, "Ошибок не было."),
    el("p", { class: "note" }, `Цифры выше — только реальные пользователи. Не входят: запросы с версии, пока она на ревью (блок «Ревью»), и наши тестовые проверки (${n.format(data.excluded_tests || 0)}). Время — UTC. Пользователь — установка расширения на одном устройстве; переустановка считается новым пользователем, а «новый» в графике запросов — это запрос в тот же день (UTC), когда установку увидели впервые. Сервер работает с 23.10.2026, поэтому все, кто пришёл с версий 1.x, в первые дни тоже выглядят новыми. Устройство и язык подписчика — из расширения, страна — из App Store; точнее страны ничего не хранится. Бесплатные подписки (подарочный код для прессы и блогеров, подписка владельца, пробный период, бесплатный код) показаны в «Подписках» отдельно и не входят в число подписок, конверсию, первую оплату, MRR и подписки из Apple Ads; такая подписка становится платящей с первой оплаты. MRR — в долларах США по сегодняшнему курсу, после комиссии Apple 15 %. В «По тарифам» Pro — все ответы Pro, бесплатные тоже. Активные до 28.10.2026 посчитаны по вопросам, дню установки и последнему заходу, поэтому за те дни цифры занижены; с 28.10 считается каждое открытие панели. Запросы с ключом пользователя видны начиная со следующей сборки после 2.1: расширение присылает только счётчики (модель, токены, время), без ключа и текста. События старше 180 дней удаляются.`)
  )
}

load()
</script>
</body>
</html>
