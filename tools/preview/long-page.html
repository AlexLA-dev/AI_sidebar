<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trail guide · Five lakes loop</title>
<!-- «Снимок страницы в заметке» (2.7): a long page for the whole-page snapshot. A sticky header (in the picture once),
     five sections of known colours and heights (each must land where it is on the page), and a cookie bar fixed at the
     bottom (in the first screen only). -->
<style>
  body { margin: 0; font: 18px/1.5 -apple-system, sans-serif; }
  header { position: sticky; top: 0; height: 64px; background: rgb(20, 20, 20); color: #fff; display: flex; align-items: center; padding: 0 20px; font-weight: 700; z-index: 2; }
  section { height: 900px; padding: 24px; box-sizing: border-box; color: #fff; font-size: 28px; font-weight: 700; }
  #s1 { background: rgb(220, 40, 40); }
  #s2 { background: rgb(40, 160, 60); }
  #s3 { background: rgb(40, 80, 220); }
  #s4 { background: rgb(230, 170, 30); }
  #s5 { background: rgb(150, 40, 180); }
  .cookie { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: rgb(255, 255, 255); color: #111; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 -2px 8px rgba(0,0,0,.2); }
</style>
</head>
<body>
<header>Five lakes loop · Trail guide</header>
<section id="s1">1 · Start at the visitor centre</section>
<section id="s2">2 · Green lake</section>
<section id="s3">3 · Blue lake</section>
<section id="s4">4 · Golden meadow</section>
<section id="s5">5 · Violet ridge</section>
<div class="cookie">We use cookies · OK</div>
</body>
</html>
