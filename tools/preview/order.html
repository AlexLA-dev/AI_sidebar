<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order 48213 · Parcelly</title>
<style>
  body { margin: 0; font: 17px/1.5 -apple-system, "Helvetica Neue", sans-serif; color: #1d1d1f; background: #f5f5f7; }
  header.site { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 14px 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  header.site .logo { width: 26px; height: 26px; border-radius: 7px; background: #7c3aed; }
  header.site span.right { margin-left: auto; color: #8e8e93; font-weight: 500; font-size: 15px; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 120px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .from { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #fbcfe8; color: #9d174d; font-weight: 700; display: grid; place-items: center; }
  .meta { color: #8e8e93; font-size: 14px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 4px 0 6px; }
  label { display: block; font-weight: 600; margin: 4px 0 8px; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; border: 1px solid #d2d2d7; border-radius: 12px; padding: 12px; min-height: 120px; background: #fff; }
  .send { margin-top: 10px; background: #7c3aed; color: #fff; border: 0; border-radius: 10px; font: 600 16px -apple-system, sans-serif; padding: 10px 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .code { font: 600 18px ui-monospace, Menlo, monospace; letter-spacing: .02em; }
  .copy { border: 1px solid #d2d2d7; background: #fff; border-radius: 9px; font: 600 15px -apple-system, sans-serif; padding: 7px 14px; color: #7c3aed; }
  .steps { margin: 6px 0 0; padding-left: 20px; color: #48484a; }
  .hero { height: 210px; border-radius: 14px; background: radial-gradient(circle at 50% 45%, #e5e7eb 0 34%, #d1d5db 35% 40%, #f3f4f6 41%); margin-bottom: 14px; }
  .price { font-size: 30px; font-weight: 700; }
  .old { color: #8e8e93; text-decoration: line-through; margin-left: 8px; font-size: 17px; }
  .stock { color: #15803d; font-weight: 600; }
  .buy { width: 100%; margin-top: 12px; background: #111827; color: #fff; border: 0; border-radius: 12px; font: 600 17px -apple-system, sans-serif; padding: 14px; }
</style>
</head>
<body>
<header class="site"><div class="logo"></div>Parcelly<span class="right">Order 48213</span></header>
<main>
<div class="card"><h1>Your parcel is on its way</h1><ul class="steps"><li>Packed at the warehouse</li><li>Handed to the courier</li><li>Arrives Thursday</li></ul></div>
<div class="card">
  <div class="meta">Tracking number</div>
  <div class="row"><span class="code" id="track">PX-7741-2093</span><button class="copy" id="copy" type="button">Copy</button></div>
</div>
</main>
<script>
document.getElementById("copy").addEventListener("click", (e) => {
  const range = document.createRange()
  range.selectNodeContents(document.getElementById("track"))
  getSelection().removeAllRanges()
  getSelection().addRange(range)
  document.execCommand("copy")
  getSelection().removeAllRanges()
  e.currentTarget.textContent = "Copied"
})
</script>
</body>
</html>
