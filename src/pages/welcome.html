<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ContextFlow</title>
  <style>
    :root { color-scheme: light dark; --accent: #2563eb; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f5f9; color: #17151c; }
    @media (prefers-color-scheme: dark) { body { background: #131217; color: #f3f2f7; } .card { background: #1c1b21 !important; } p { color: #b6b3c0 !important; } }
    .card { max-width: 460px; width: 100%; background: #fff; border-radius: 22px; padding: 36px 28px; text-align: center; box-shadow: 0 10px 40px rgba(20, 14, 40, 0.12); }
    .logo { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #38bdf8, #2563eb); color: #fff; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.32); }
    h1 { font-size: 24px; margin: 0 0 10px; letter-spacing: -0.01em; }
    p { margin: 0 0 12px; color: #5d5a66; }
    .note { font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.4 3.9 1.3 5.9 2.7 7.2 1.4 1.4 3.4 2.2 6.8 2.6-3.4.4-5.4 1.3-6.8 2.6-1.4 1.4-2.3 3.4-2.7 7.1-.4-3.7-1.3-5.7-2.7-7.1-1.4-1.3-3.4-2.2-6.8-2.6 3.4-.4 5.4-1.2 6.8-2.6 1.4-1.3 2.3-3.3 2.7-7.2z"/></svg>
    </div>
    <h1 data-i18n="welcomeTitle"></h1>
    <p id="restricted" data-i18n="welcomeRestricted" hidden></p>
    <p data-i18n="welcomeBody"></p>
    <p class="note" data-i18n="welcomePermission"></p>
  </main>
  <script src="dist/welcome.js"></script>
</body>
</html>
