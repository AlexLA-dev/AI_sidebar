# ContextFlow backend + website (aisidebar.netlify.app)
#
# Static pages (site/): landing, privacy, terms, support — linked from the App Store.
# Functions (netlify/functions/): the API used by the Safari extension.
#   POST /api/v2/chat     streaming answers (new builds)
#   POST /api/v2/status   plan + remaining allowance (new builds)
#   /.netlify/functions/chat-proxy        compatibility for builds <= 40
#   /.netlify/functions/appstore-verify   App Store Server Notifications V2
#   /.netlify/functions/stripe-webhook    audit-only (Stripe is no longer sold)
#
# Environment variables (Netlify UI → Project configuration → Environment variables):
#   OPENAI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   required
#   OPENAI_MODEL (default "gpt-4.1-mini,gpt-4o-mini"), FREE_DAILY_LIMIT (5),
#   FREE_IP_DAILY_LIMIT (40), FREE_GLOBAL_DAILY_LIMIT (3000), PRO_WEEKLY_LIMIT (375)
#   APPSTORE_BUNDLE_ID (com.contextflow.app), STRIPE_WEBHOOK_SECRET

[build]
  command = "echo 'Static site, functions are bundled by Netlify'"
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Old builds send sign-up confirmation links here.
[[redirects]]
  from = "/email-confirmed"
  to = "/.netlify/functions/email-confirmed"
  status = 200

[[redirects]]
  from = "/confirm"
  to = "/.netlify/functions/email-confirmed"
  status = 200
