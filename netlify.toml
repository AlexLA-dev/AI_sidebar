# ContextFlow backend + website
#
# The site lives at https://context-flow.app. aisidebar.netlify.app is the same Netlify site: shipped app
# builds call its /api/... and /.netlify/functions/..., so only the pages listed at the end redirect from it.
#
# Static pages (site/): landing, privacy, terms, support — linked from the App Store.
# Functions (netlify/functions/): the API used by the Safari extension.
#   POST /api/v2/chat     streaming answers (new builds)
#   POST /api/v2/status   plan + remaining allowance (new builds)
#   POST /api/v2/usage    usage counters for answers made with the user's own key
#   GET  /api/v2/admin/usage   analytics for site/analytics.html (Bearer ADMIN_TOKEN)
#   /.netlify/functions/chat-proxy        compatibility for builds <= 40
#   /.netlify/functions/appstore-verify   App Store Server Notifications V2
#   /.netlify/functions/stripe-webhook    audit-only (Stripe is no longer sold)
#
# Environment variables (Netlify UI → Project configuration → Environment variables):
#   OPENAI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   required
#   ANTHROPIC_API_KEY   answers from Claude first, OpenAI when Claude can't (unset = OpenAI only)
#   ANTHROPIC_MODEL_FREE / _PRO (claude-sonnet-5-5), ANTHROPIC_EFFORT_FREE (low) / _PRO (medium),
#   ANTHROPIC_MAX_TOKENS_FREE (3000) / _PRO (8000), CLAUDE_ANSWERS=off switches Claude off,
#   CLAUDE_MIN_BUILD (67): older app builds and requests without client.build stay on OpenAI
#   OPENAI_MODEL (default "gpt-4.1-mini,gpt-4o-mini"), FREE_DAILY_LIMIT (5),
#   FREE_IP_DAILY_LIMIT (40), FREE_GLOBAL_DAILY_LIMIT (3000), PRO_WEEKLY_LIMIT (375)
#   APPSTORE_BUNDLE_ID (com.contextflow.app), STRIPE_WEBHOOK_SECRET

[build]
  command = "echo 'Static site, functions are bundled by Netlify'"
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Old builds send sign-up confirmation links here.
[[redirects]]
  from = "/email-confirmed"
  to = "/.netlify/functions/email-confirmed"
  status = 200

[[redirects]]
  from = "/confirm"
  to = "/.netlify/functions/email-confirmed"
  status = 200

# Pages (and only pages) move from the old host to the domain. Never add /api, /.netlify, /confirm or
# /email-confirmed here: old builds POST to the API and open those links on aisidebar.netlify.app.
[[redirects]]
  from = "https://aisidebar.netlify.app/"
  to = "https://context-flow.app/"
  status = 301
  force = true

[[redirects]]
